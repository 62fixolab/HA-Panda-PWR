name: "Tests"

on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  pytest:
    name: "Pytest (${{ matrix.name }})"
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "oldest supported Home Assistant"
            python-version: "3.12"
            requirements: "tests/requirements_min.txt"
          - name: "latest Home Assistant"
            python-version: "3.14"
            requirements: "requirements_test.txt"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Set up Python"
          uses: actions/setup-python@v7.1.0
          with:
            python-version: ${{ matrix.python-version }}
            cache: "pip"
            cache-dependency-path: |
              requirements.txt
              ${{ matrix.requirements }}

        - name: "Install requirements"
          run: python3 -m pip install -r ${{ matrix.requirements }}

        - name: "Run tests"
          run: python3 -m pytest
