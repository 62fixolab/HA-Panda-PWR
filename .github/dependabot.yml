# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Oldest supported Home Assistant and the packages its tests need; these
    # pins must match hacs.json, so they are only changed by hand.
    exclude-paths:
      - "tests/requirements_min.txt"
    groups:
      # pytest-homeassistant-custom-component pins an exact Home Assistant
      # release, so both must move together.
      home-assistant:
        patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
